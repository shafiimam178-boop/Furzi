<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FURZI | Premium Fashion Deals</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-white text-gray-900 overflow-x-hidden">

<!-- ================= INTRO SCREEN ================= -->
<div id="intro">
  <h1 class="logo">FURZI</h1>
</div>

<!-- ================= NAVBAR ================= -->
<header class="sticky top-0 bg-white shadow-sm z-40">
  <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold tracking-widest">FURZI</h1>

    <nav class="hidden md:flex space-x-8 font-medium">
      <a href="#" class="hover:text-black text-gray-600">Men</a>
      <a href="#" class="hover:text-black text-gray-600">Women</a>
      <a href="#" class="hover:text-black text-gray-600">Trending</a>
    </nav>
  </div>
</header>

<!-- ================= HERO SECTION ================= -->
<section class="hero">
  <div class="hero-content">
    <h2 class="text-4xl md:text-6xl font-bold mb-6">
      Pinterest Trending Fashion 🔥
    </h2>
    <p class="mb-8 text-lg opacity-90">
      Discover viral outfits and aesthetic fashion finds curated specially for you.
    </p>
    <a href="#products" class="btn">
      Explore Now
    </a>
  </div>
</section>

<!-- ================= PRODUCT SECTION ================= -->
<section id="products" class="max-w-7xl mx-auto px-4 py-16">

  <h2 class="text-3xl font-bold mb-10 text-center">Trending Deals</h2>

  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

    <!-- Product Card -->
    <div class="group bg-white rounded-xl overflow-hidden shadow-sm hover:shadow-xl transition duration-300">
      <div class="relative">
        <img src="https://source.unsplash.com/500x600/?fashion,men"
             class="w-full h-64 object-cover group-hover:scale-105 transition duration-300">
        <span class="absolute top-3 left-3 bg-red-600 text-white text-xs px-3 py-1 rounded-full">
          60% OFF
        </span>
      </div>
      <div class="p-4">
        <h3 class="font-semibold text-sm mb-2">
          Premium Casual Shirt
        </h3>
        <p class="text-gray-600 mb-3">
          ₹799 <span class="line-through text-sm text-gray-400">₹1999</span>
        </p>
        <a href="#" target="_blank"
           class="block text-center bg-black text-white py-2 rounded-lg hover:bg-gray-800 transition">
          View Deal
        </a>
      </div>
    </div>

  </div>
</section>

<!-- ================= FOOTER ================= -->
<footer class="bg-gray-100 py-8 text-center text-gray-600 text-sm">
  © 2026 FURZI. This page contains affiliate links.
</footer>

</body>
</html>
